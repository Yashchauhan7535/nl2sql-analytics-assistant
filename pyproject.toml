[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-analytics-assistant"
version = "0.1.0"
description = "Natural language to SQL analytics assistant for the Olist e-commerce dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "altair>=5.4.0",
    "openai>=1.50.0",
    "sqlglot>=25.0.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
